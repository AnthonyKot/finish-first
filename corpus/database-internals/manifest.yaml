editorial_gate:
  status: pass
  reviewed_on: "2026-08-12"
  selected_payoff: "A successful consensus decision and an observed client success are different facts."
  rationale: "The late consensus chapter makes timeout ambiguity operational: a proposer may disappear before replying while another proposer safely finishes the value. The earlier chapters explain the links, failure suspicions, leadership, ordering, and retry discipline needed to reason about that result."
  duplication: "Distinct from the selected Software Architecture essay: this is a mechanism-level failure and retry model, not a general trade-off-analysis method."
  currency: "The selected principles are foundational and still useful. Treat the 2019 algorithm catalog as a historical map rather than a current survey, and check implementation details against primary papers and current system documentation."
  caution: "PDF p. 307 (printed p. 287) ambiguously equates consensus with acceptance by one acceptor; the adjacent quorum discussion and failure scenarios, and Lamport's primary description, require a majority before a proposal is chosen."

