editorial_gate:
  decision: "PASS_WITH_CURRENCY_BOUNDARY"
  selected_payoff: >-
    A condition that makes a failure appear is not necessarily its root cause. The late
    troubleshooting chapter separates signs, symptoms, underlying etiology, and a
    promoter, then asks for experiments that can disconfirm a tempting explanation.
  why_not_skipped: >-
    The enclosure-flex example turns a common intermittent hardware failure into a
    durable causal discipline: do not repair the trigger while leaving the latent defect
    intact. Earlier chapters supply mechanical support, test access, preserved pre-change
    evidence, incremental integration, realistic stress tests, and a narrative lab record.
    This is a substantial reverse path rather than a collection of component recipes.
  distinctiveness: >-
    Distinct from every accepted essay reviewed on 2026-08-12: the shelf's existing
    payoffs concern ML failure envelopes, architecture trade-offs, staff-level influence,
    Rust migration seams, Go representation guarantees, distributed timeout ambiguity,
    API-security coverage, semantic drift in systems, and multicore scaling/false sharing.
    A concurrently accepted essay adds cloud-cost commitment sequencing. None centers on
    causal diagnosis of intermittent physical hardware faults.
  currency_boundary: >-
    The official publisher still lists this August 2025 title and ISBN as current. The
    selected diagnostic model is not tool-version-dependent. Treat regulatory summaries,
    standards tables, named vendors, prices, URLs, and equipment recommendations as a
    2025 snapshot; verify them with the applicable regulator, current standard, and device
    jurisdiction before acting.
