editorial_gate:
  decision: "PASS_WITH_MAJOR_CURRENCY_AND_ACCURACY_BOUNDARY"
  selected_payoff: >-
    Cost optimization is an ordered dependency problem: first establish workload purpose
    and constraints, then remove or reshape usage, and only then buy rate commitments for
    the stable remainder. A discount purchased too early can fossilize waste.
  why_not_skipped: >-
    Chapter 12 makes the sequence concrete across architecture, rightsizing, schedules,
    commitments, and licensing. The method changes an engineering decision and supports
    a small evidence-producing reading task; it is more than a provider-tool survey.
  distinctiveness: >-
    No accepted essay centers cloud economics or the dependency between usage reduction
    and rate commitments. The existing essays address ML failure envelopes, architecture
    trade-offs, staff-level leverage, migration seams, Go system guarantees, distributed
    timeout ambiguity, API-security coverage, systems-thinking semantic drift, and CPU
    scaling/coherence.
  currency_boundary: >-
    The current FinOps Framework extends beyond public cloud to technology value, current
    provider portfolios differ, and some Azure VM reservation availability changed in July
    2026. Use the book for the sequencing argument, not for current SKUs, price claims,
    service defaults, APIs, licensing terms, or framework scope.
  accuracy_warnings:
    - "PDF pages 188-189 mix an all-upfront break-even calculation with a no-upfront claim; do not reuse the formula as written."
    - "PDF pages 388-396 call S3 a NoSQL document store and treat versioning as a replacement for Multi-AZ; current AWS documentation separates S3's built-in multi-AZ resilience, object-version recovery, and RDS failover."
    - "The worked case studies use simplified assumptions and July 2023 retail prices, and omit material costs such as egress in the first case (PDF pages 368-369)."
  review: "notes/review-efficient-cloud-finops.md"
  essay: "essays/efficient-cloud-finops.md"
