editorial_gate:
  decision: "PASS_WITH_CURRENCY_BOUNDARY"
  reviewed_on: "2026-08-12"
  selected_payoff: >-
    A mission statement can remain verbally stable while every operative word changes
    meaning; modernization begins by exposing that semantic drift and redesigning the
    system around the present purpose rather than replacing components inside the old one.
  why_not_skipped: >-
    The final MAGO case makes an otherwise abstract systems-thinking claim concrete. It
    traces how publish, information, products, people, pay, and consume changed beneath
    one apparently stable purpose, then connects the revised purpose to activities,
    measures, language, structures, patterns, and mental models. Earlier chapters supply
    a usable reverse path through conceptual integrity, the Iceberg Model, pattern
    questions, collaborative modeling, and systems leadership.
  duplication: >-
    Distinct from the shelf's architecture trade-off method: this payoff tests whether
    the words defining the decision still describe the current system before options are
    compared. It also does not duplicate the selected essays on staff leverage, API
    coverage, ML failure envelopes, migration seams, systems-programming guarantees,
    or consensus ambiguity.
  currency_boundary: >-
    The 2024 systems practices and semantic-drift argument remain usable, but topical
    examples and statistics are snapshots. In particular, Chapter 12's statement that
    one in 100 U.S. citizens is in prison should not be reused as a current fact; current
    Bureau of Justice Statistics tables use different populations and report materially
    different rates. Validate contemporary claims separately.
