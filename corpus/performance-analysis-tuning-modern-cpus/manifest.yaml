editorial_gate:
  status: pass
  reviewed_on: "2026-08-12"
  selected_payoff: "A thread-count curve can bend backward because added workers create contention and cache-line coherence traffic; different variables on one cache line can still make cores fight over ownership."
  rationale: "Chapter 11 turns the familiar warning that parallel speedup is limited into a concrete diagnostic path: measure scaling, separate useful work from waiting and spinning, then investigate synchronization and cache-line contention rather than optimizing an arbitrary hot worker."
  distinctiveness: "Distinct from all accepted essays: the shelf currently covers ML failure envelopes, architecture trade-offs, staff-level leverage, Rust migration seams, Go representation boundaries, distributed timeout ambiguity, and API-security coverage. None foregrounds hardware-level multicore scaling or false sharing."
  currency: "The author released a substantially expanded second edition in 2024, so this local first edition is not a current tool manual. The selected scaling and coherence model remains current: the second-edition material calls thread-count scaling especially valuable, and current perf c2c documentation still describes cache-line-contention analysis across supported architectures."
  cautions:
    - "Prefer the 2024 second edition for new study; use the local edition for the cited conceptual path only."
    - "PDF page 158 overstates that true sharing implies data races. The shown unsynchronized example races, but true sharing can also use atomics or synchronization."
    - "Verify exact VTune and perf procedures against current vendor and kernel documentation and the target CPU."

