  selected_payoff: >-
    The safest unit of a language migration is a deliberately designed seam: a small,
    testable interface that lets the existing host and a replacement module coexist,
    be compared, and be swapped independently.
  why_not_skipped: >-
    The final WebAssembly example makes the book's incremental-refactoring argument
    concrete by swapping two implementations behind one host contract without
    recompiling that host. The recipe has already aged, but the boundary-design,
    behavioral-equivalence, and measurement lessons remain useful and distinct from
    the currently selected software-architecture, ML-engineering, and staff-engineering
    companions.
