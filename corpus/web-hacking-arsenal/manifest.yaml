editorial_gate:
  status: pass
  reviewed_on: "2026-08-31"
  selected_payoff: >-
    A vulnerability is not the deliverable; the decision it produces is. The same true finding
    changes value depending on whether its impact is argued in the client's business context.
  rationale: >-
    Chapter 14 (Report Writing, printed pp. 509-530 / PDF pp. 540-561) is the last chapter and
    the only method-shaped one. It separates three reader tiers, treats the narrative as the
    unit of persuasion, states plainly why the author's practice often declines to use CVSS,
    and gives a rating scheme in which visibility and exploit difficulty - not a vector string -
    move the rating. The book supplies two concrete consequences of getting this wrong or right:
    valid bug bounty findings set aside because the write-up was hard to follow (printed p. 509
    / PDF p. 540), and a doubled Synack reward after patient-data context was added to a report
    (printed p. 523 / PDF p. 554). This reasoning does not decay the way the payload chapters do.
  duplication: >-
    Distinct from the selected Defending APIs essay. That essay covers a defender's
    organization-wide coverage program; this one covers the tester's deliverable - how a
    finding becomes a decision an owner acts on. No other selected essay addresses offensive
    testing or findings communication.
  currency: >-
    Pass for the reporting method and the business-logic reasoning that feeds it. Do not treat
    the technical chapters as a 2026 payload reference; the book self-flags payload decay
    (printed p. 472 / PDF p. 503). Three specific reporting details in Chapter 14 are stale and
    are flagged in the essay: CVSS is described as "currently at version 3.1" (printed p. 517 /
    PDF p. 548) though CVSS v4.0 was released 2023-11-01; OSVDB is recommended as a reference
    database (printed p. 517 / PDF p. 548) though it shut down in April 2016; and "OWASP Top 10"
    is named as a web methodology without an edition (printed p. 520 / PDF p. 551) - the 2025
    edition has since reordered categories and folded SSRF into Broken Access Control.
  caution: >-
    Authorized-testing context only. The essay directs the reader to the book's methodology and
    reasoning and deliberately does not reproduce payloads, bypasses, or step-by-step exploit
    sequences.

