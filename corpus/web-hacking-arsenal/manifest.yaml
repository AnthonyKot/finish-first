      Screenshots of tool interfaces (Burp, ZAP, CVSS calculators, dashboards) are the primary
      evidence for many procedural steps. Any claim about what a screenshot shows is unknown
      from the extraction and is not made in the essay.
    - >-
      No table of figures, no bibliography section, and no glossary were found in the
      extracted front or back matter; the copyright page states the book "includes
